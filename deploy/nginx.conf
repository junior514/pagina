# /etc/nginx/sites-available/electrind
# Nginx delante de Next.js: HTTPS, compresión y caché de archivos estáticos.

upstream electrind_app {
    server 127.0.0.1:3000;
    keepalive 64;
}

# Caché de imágenes optimizadas por Next.js
proxy_cache_path /var/cache/nginx/electrind levels=1:2 keys_zone=electrind:50m max_size=2g inactive=30d use_temp_path=off;

server {
    listen 80;
    server_name electrind.pe www.electrind.pe;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name electrind.pe www.electrind.pe;

    # Certificados de Let's Encrypt (certbot --nginx)
    ssl_certificate     /etc/letsencrypt/live/electrind.pe/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/electrind.pe/privkey.pem;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Archivos JS/CSS con hash: caché de 1 año servida directamente por Nginx
    location /_next/static/ {
        alias /var/www/electrind/.next/static/;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location /images/ {
        alias /var/www/electrind/public/images/;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location /_next/image {
        proxy_pass http://electrind_app;
        proxy_cache electrind;
        proxy_cache_valid 200 30d;
        proxy_cache_use_stale error timeout updating;
        add_header X-Cache-Status $upstream_cache_status;
    }

    location / {
        proxy_pass http://electrind_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache electrind;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
    }
}
